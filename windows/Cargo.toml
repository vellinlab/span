[package]
name = "span-native"
version = "0.1.0-rc.26"
edition = "2024"
publish = false

[[bin]]
name = "span"
path = "src/main.rs"

[dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
iced = { version = "0.14", default-features = false, features = [
    "advanced", "canvas", "svg", "tiny-skia", "tokio", "wgpu",
] }
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
strip = "debuginfo"
