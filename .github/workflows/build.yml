name: Build Linux

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install GTK, VTE and X11 test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config dpkg-dev libgtk-4-dev libvte-2.91-gtk4-dev \
            dbus-daemon desktop-file-utils xvfb xauth xdotool

      - name: Check formatting and build
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          cargo +1.98.1 fmt --all -- --check
          cargo +1.98.1 build --locked --release

      - name: Package and test on X11 with Cairo
        run: |
          desktop-file-validate packaging/io.github.zyw02.SshWorkbench.desktop
          bash packaging/package-deb.sh
          package=(dist/*.deb)
          extracted="$(mktemp -d)"
          dpkg-deb --info "${package[0]}"
          dpkg-deb --extract "${package[0]}" "$extracted"
          xvfb-run -a dbus-run-session -- bash packaging/smoke-test.sh "$extracted/usr/bin/ssh-workbench"

      - name: Upload Debian package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ssh-workbench-linux-amd64
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 30
