[package]
name = "span"
version = "0.1.0-rc.20"
edition = "2024"
description = "A desktop terminal for local shells and OpenSSH sessions"

[dependencies]
async-tungstenite = "0.35"
futures-channel = "0.3"
futures-util = { version = "0.3", features = ["io", "sink"] }
glob = "0.3"
gtk = "0.19"
pangocairo = "0.22"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde_json = "1"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
tl = "0.7.8"

[target.'cfg(windows)'.dependencies]
alacritty_terminal = { version = "0.26", default-features = false }

[profile.release]
strip = "debuginfo"
