[package]
name = "span-workbench-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-tungstenite = "0.35"
base64 = "0.22"
futures-util = { version = "0.3", features = ["sink"] }
portable-pty = "0.9"
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }

[profile.release]
strip = "debuginfo"
