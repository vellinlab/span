[package]
name = "span"
version = "0.1.0-rc.8"
edition = "2024"
description = "A Linux desktop terminal for local shells and OpenSSH sessions"

[dependencies]
async-tungstenite = "0.35"
futures-channel = "0.3"
futures-util = { version = "0.3", features = ["io", "sink"] }
gtk = "0.19"
pangocairo = "0.22"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde_json = "1"
tl = "0.7.8"

[profile.release]
strip = "debuginfo"
