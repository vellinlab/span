name: Build native Windows frontend

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: windows-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        shell: pwsh
        run: rustup toolchain install 1.98.1 --profile minimal

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: native-cache
        with:
          path: |
            ~/.cargo/registry
            windows/target
          key: windows-native-rust-1.98.1-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: windows-native-rust-1.98.1-

      - name: Build and test ConPTY
        shell: pwsh
        run: |
          cargo +1.98.1 test --locked --release --manifest-path windows/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.98.1 build --locked --release --manifest-path windows/Cargo.toml

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ !cancelled() && steps.native-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            windows/target
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Verify native SSH terminal, SFTP, and remote Codex
        timeout-minutes: 4
        shell: pwsh
        run: |
          python -m pip install --no-cache-dir --only-binary=:all: paramiko==5.1.0 wsproto==1.3.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python windows/tests/ssh_fixture.py cargo +1.98.1 test --locked --release --manifest-path windows/Cargo.toml windows_ssh -- --ignored --nocapture

      - name: Package and test the relocated ZIP
        shell: pwsh
        run: |
          $version = (Select-String -LiteralPath Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $windowsVersion = (Select-String -LiteralPath windows/Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          if (!$version -or $version -ne $windowsVersion) {
            throw "Cargo versions differ: EL8 $version, Windows $windowsVersion"
          }
          $portable = Join-Path $env:RUNNER_TEMP 'Span'
          $relocated = Join-Path $env:RUNNER_TEMP 'Span relocated'
          $source = 'windows/target/release/span.exe'
          $app = Join-Path $relocated 'Span/Span.exe'
          $package = "dist/span-$version-windows-x86_64.zip"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          New-Item -ItemType Directory -Path $portable | Out-Null
          Copy-Item $source (Join-Path $portable 'Span.exe')
          Compress-Archive -Path $portable -DestinationPath $package
          Expand-Archive -LiteralPath $package -DestinationPath $relocated
          $files = @(Get-ChildItem -LiteralPath $relocated -File -Recurse -Force)
          if ($files.Count -ne 1 -or !(Test-Path -LiteralPath $app -PathType Leaf)) {
            throw "The portable ZIP should contain only Span/Span.exe"
          }
          if ((Get-FileHash $app).Hash -ne (Get-FileHash $source).Hash) {
            throw "The portable ZIP executable differs from the release build"
          }
          $env:Path = @(
            "$env:SystemRoot\System32",
            "$env:SystemRoot",
            "$env:SystemRoot\System32\WindowsPowerShell\v1.0",
            "$env:SystemRoot\System32\OpenSSH"
          ) -join ';'
          Remove-Item Env:ICED_BACKEND -ErrorAction SilentlyContinue
          $env:RUST_BACKTRACE = "1"
          $timer = [Diagnostics.Stopwatch]::StartNew()
          $stderr = Join-Path $env:RUNNER_TEMP "span-startup-stderr.log"
          $span = Start-Process $app -WorkingDirectory $env:RUNNER_TEMP -PassThru -RedirectStandardError $stderr
          try {
            for ($i = 0; $i -lt 120; $i++) {
              $span.Refresh()
              if ($span.HasExited) { throw "Span exited before opening its window with code $($span.ExitCode)" }
              if ($span.MainWindowHandle -ne [IntPtr]::Zero) { break }
              Start-Sleep -Milliseconds 100
            }
            if ($span.MainWindowHandle -eq [IntPtr]::Zero) { throw "Span did not open a window" }
            $startup = $timer.ElapsedMilliseconds
            Start-Sleep -Seconds 2
            $span.Refresh()
            if ($span.HasExited) { throw "Span exited after opening its window" }
            if ($span.MainWindowTitle -ne "Span") { throw "Unexpected window: $($span.MainWindowTitle)" }
            $metrics = [PSCustomObject]@{
              Renderer = 'tiny-skia'
              WindowMs = $startup
              PrivateBytes = $span.PrivateMemorySize64
              WorkingSetBytes = $span.WorkingSet64
              ZipBytes = (Get-Item $package).Length
              ZipSHA256 = (Get-FileHash $package).Hash
            }
          } finally {
            if (!$span.HasExited) {
              $closeTimer = [Diagnostics.Stopwatch]::StartNew()
              $closePosted = $span.CloseMainWindow()
              if (!$span.WaitForExit(5000)) {
                $span.Refresh()
                Write-Host "Close posted: $closePosted. Remaining handle: $($span.MainWindowHandle). Title: $($span.MainWindowTitle). Responding: $($span.Responding)."
                Get-CimInstance Win32_Process -Filter "ParentProcessId=$($span.Id)" |
                  Format-Table ProcessId, Name
                Stop-Process -Id $span.Id
                Get-Content $stderr
                throw "Span did not close within five seconds"
              }
            }
            if (Test-Path $stderr) { Get-Content $stderr }
          }
          if ($span.ExitCode -ne 0) { throw "Span exited with code $($span.ExitCode)" }
          $metrics | Add-Member -NotePropertyName CloseMs -NotePropertyValue $closeTimer.ElapsedMilliseconds
          $metrics | ConvertTo-Json | Set-Content dist/windows-native-startup.json
          $metrics | Format-Table

      - name: Verify Windows history, clipboard and session goals, and measure wheel input
        shell: pwsh
        run: |
          Remove-Item Env:ICED_BACKEND -ErrorAction SilentlyContinue
          $env:RUST_BACKTRACE = "1"
          foreach ($backend in "tiny-skia", "auto") {
            $features = if ($backend -eq "auto") { "visual-check,gpu" } else { "visual-check" }
            cargo +1.98.1 build --locked --release --features $features --manifest-path windows/Cargo.toml
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $output = New-Item -ItemType Directory -Path "dist/windows-session-check/$backend" -Force
            $env:SPAN_VISUAL_CHECK_DIR = $output.FullName
            $stderr = Join-Path $output.FullName "stderr.log"
            $span = Start-Process windows/target/release/span.exe -PassThru -RedirectStandardError $stderr
            try {
              if (!$span.WaitForExit(50000)) { throw "$backend session check timed out" }
              if ($span.ExitCode -ne 0) { throw "$backend session check exited with code $($span.ExitCode)" }
              foreach ($file in "latest.png", "typography.json", "copy.json", "earlier.png", "history.json", "scroll.json", "attachment.png", "attachment.json", "goal-menu.png", "goal-edit.png", "goal-active.png", "goal.json", "resize-900.png", "resize-1320.png", "reading-position.json", "activity-idle.png", "activity-hover.png", "activity-diff.png", "activity.json", "file-suggestions.png", "file-suggestions.json") {
                if (!(Test-Path (Join-Path $output.FullName $file))) { throw "Missing $backend $file" }
              }
              Write-Host "$backend session and scroll metrics"
              Get-Content (Join-Path $output.FullName "history.json")
              Get-Content (Join-Path $output.FullName "copy.json")
              Get-Content (Join-Path $output.FullName "typography.json")
              Get-Content (Join-Path $output.FullName "scroll.json")
              Get-Content (Join-Path $output.FullName "attachment.json")
              Get-Content (Join-Path $output.FullName "goal.json")
              Get-Content (Join-Path $output.FullName "reading-position.json")
              Get-Content (Join-Path $output.FullName "activity.json")
              Get-Content (Join-Path $output.FullName "file-suggestions.json")
            } finally {
              if (!$span.HasExited) { Stop-Process -Id $span.Id }
              Get-Content $stderr
            }
          }

      - name: Upload session screenshots and metrics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: span-windows-session-check
          path: dist/windows-session-check

      - name: Compare against a Windows transcript baseline
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Windows-Benchmark:')
        shell: pwsh
        run: |
          $note = git log -1 --format=%B
          $marker = $note | Where-Object { $_ -match '^Windows-Benchmark: [0-9a-f]{40}$' } | Select-Object -First 1
          if (!$marker) { throw "Expected a full baseline commit in the Windows-Benchmark trailer" }
          $baseline = ($marker -split ' ')[1]
          git fetch --no-tags --depth=1 origin $baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $baseTree = Join-Path $env:RUNNER_TEMP "span-baseline"
          git worktree add --detach $baseTree $baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CARGO_TARGET_DIR = (Resolve-Path windows/target).Path
          $candidate = Join-Path $env:RUNNER_TEMP "span-candidate.exe"
          $reference = Join-Path $env:RUNNER_TEMP "span-reference.exe"
          cargo +1.98.1 build --locked --release --features visual-check --manifest-path windows/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item windows/target/release/span.exe $candidate
          cargo +1.98.1 build --locked --release --features visual-check --manifest-path (Join-Path $baseTree "windows/Cargo.toml")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item windows/target/release/span.exe $reference
          Remove-Item Env:ICED_BACKEND -ErrorAction SilentlyContinue
          $env:RUST_BACKTRACE = "1"
          $comparison = @(
            @{ label = "baseline-1"; program = $reference },
            @{ label = "candidate-1"; program = $candidate },
            @{ label = "candidate-2"; program = $candidate },
            @{ label = "baseline-2"; program = $reference }
          )
          foreach ($sample in $comparison) {
            $output = New-Item -ItemType Directory -Path "dist/windows-comparison/$($sample.label)" -Force
            $env:SPAN_VISUAL_CHECK_DIR = $output.FullName
            $stderr = Join-Path $output.FullName "stderr.log"
            $span = Start-Process $sample.program -PassThru -RedirectStandardError $stderr
            try {
              if (!$span.WaitForExit(50000)) { throw "$($sample.label) timed out" }
              if ($span.ExitCode -ne 0) { throw "$($sample.label) exited with code $($span.ExitCode)" }
              Write-Host $sample.label
              Get-Content (Join-Path $output.FullName "scroll.json")
              Get-Content (Join-Path $output.FullName "history.json")
            } finally {
              if (!$span.HasExited) { Stop-Process -Id $span.Id }
              Get-Content $stderr
            }
          }
          $baseline | Set-Content dist/windows-comparison/baseline.txt
          $env:GITHUB_SHA | Set-Content dist/windows-comparison/candidate.txt

      - name: Upload Windows performance comparison
        if: always() && github.event_name == 'push' && contains(github.event.head_commit.message, 'Windows-Benchmark:')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: span-windows-comparison
          path: dist/windows-comparison

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/span-*-windows-x86_64.zip
          archive: false
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/windows-native-startup.json
          archive: false
          if-no-files-found: error
