[package]
name = "ssh-workbench"
version = "0.6.0"
edition = "2024"
description = "A Linux desktop terminal for local shells and OpenSSH sessions"

[dependencies]
gtk = "0.19"
pangocairo = "0.22"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde_json = "1"

[profile.release]
strip = "debuginfo"
