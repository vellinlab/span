name: Build and release EL8 and Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  el8-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test RPM in AlmaLinux 8
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          upgrade_dir="$RUNNER_TEMP/span-upgrade"
          mkdir -p "$upgrade_dir"
          baseline=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            baseline_name=span-0.1.0-rc.14-1.el8.x86_64.rpm
            gh release download v0.1.0-rc.14 --pattern "$baseline_name" --dir "$upgrade_dir"
            baseline=("/span-upgrade/$baseline_name")
          fi
          compare=()
          if [[ "$GITHUB_REF" == refs/heads/perf/* || "$GITHUB_REF" == refs/tags/v0.1.0-rc.22 ]]; then
            baseline_tag=v0.1.0-rc.26
            if [[ "$GITHUB_REF" == refs/tags/v0.1.0-rc.22 ]]; then baseline_tag=v0.1.0-rc.21; fi
            previous="span-${baseline_tag#v}-1.el8.x86_64.rpm"
            curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$baseline_tag/$previous" \
              --output "$upgrade_dir/$previous"
            compare=(--env "SPAN_BENCH_RPM=/span-upgrade/$previous")
          fi
          docker run --rm "${compare[@]}" --volume "$PWD:/work" --workdir /work \
            --volume "$upgrade_dir:/span-upgrade:ro" \
            almalinux:8 bash packaging/build-el8.sh "${baseline[@]}"

      - name: Upload RPM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: span-el8-x86_64
          path: dist/span-*.rpm
          if-no-files-found: error
          retention-days: 30

      - name: Upload corresponding VTE source
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vte-0.64.2-source
          path: dist/vte-0.64.2.tar.xz
          if-no-files-found: error
          retention-days: 30

  windows:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/windows.yml

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [el8-x86_64, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download EL8 package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: span-el8-x86_64
          path: release

      - name: Download corresponding VTE source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vte-0.64.2-source
          path: release

      - name: Download Windows portable package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: span-*-windows-x86_64.zip
          path: release
          merge-multiple: true
          skip-decompress: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml)"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            printf 'Tag %s does not match Cargo version %s.\n' "$RELEASE_TAG" "$version" >&2
            exit 1
          fi
          package_version="$(bash packaging/package-version.sh)"
          rpm_asset="release/span-$version-1.el8.x86_64.rpm"
          if [[ "$package_version" != "$version" ]]; then
            mv -- "release/span-$package_version-1.el8.x86_64.rpm" "$rpm_asset"
          fi
          assets=(
            "$rpm_asset"
            "release/span-$version-windows-x86_64.zip"
            "release/vte-0.64.2.tar.xz"
          )
          for asset in "${assets[@]}"; do
            test -s "$asset"
          done
          flags=()
          if [[ "$version" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          export GH_REPO="$GITHUB_REPOSITORY"
          if draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"; then
            if [[ "$draft" == false ]]; then
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "Span $version" --notes-from-tag --draft "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false "${flags[@]}"
