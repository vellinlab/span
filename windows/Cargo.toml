[package]
name = "span-native"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "span"
path = "src/main.rs"

[features]
gpu = ["iced/wgpu"]
visual-check = []

[dependencies]
async-tungstenite = "0.35"
alacritty_terminal = { version = "0.26", default-features = false }
base64 = "0.22"
iced = { version = "0.14", default-features = false, features = [
    "advanced", "canvas", "highlighter", "image", "markdown", "svg", "tiny-skia", "tokio",
] }
futures = "0.3"
glob = "0.3"
htmd = "0.6"
image = { version = "0.25", default-features = false, features = ["bmp", "ico", "jpeg", "png"] }
open = "5"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "process", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"
rfd = { version = "0.17", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
strip = "debuginfo"
