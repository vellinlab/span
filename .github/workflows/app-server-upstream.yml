name: Review App Server upstream

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare the verified baseline with the latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          read -r baseline _ < packaging/app-server-baseline
          latest="$(gh api repos/openai/codex/releases/latest --jq .tag_name)"
          printf '## App Server 更新评估\n\n- Span 回归基线：`%s`\n- 上游稳定版：`%s`\n\n' \
            "$baseline" "$latest" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$baseline" == "$latest" ]]; then
            printf '%s\n' '基线与上游稳定版一致。' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          changes="$RUNNER_TEMP/app-server-upstream.json"
          gh api --paginate \
            "repos/openai/codex/compare/$baseline...$latest?per_page=100" | jq -s . > "$changes"
          python3 packaging/report-app-server-upstream.py "$baseline" "$latest" "$changes" |
            tee -a "$GITHUB_STEP_SUMMARY"
