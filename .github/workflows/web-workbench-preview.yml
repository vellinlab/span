name: Span web workbench experiment

on:
  push:
    branches: [prototype/web-workbench]
  workflow_dispatch:

permissions:
  contents: read

env:
  FOLLOWING_REPLY_BASELINE: 28b8963cefc13f084686e0d29127ee4232f4f824
  TERMINAL_RENDERER_BASELINE: b4d95f68481e073da9fa4df344629a5b9d07f1b5
  TERMINAL_COVER_BASELINE: 1f708fcb93da896f425cdc292ad07adddc1204e6
  TERMINAL_WINDOW_BASELINE: 127feffb69fbd7a752c49b7666f3198a3c0e8cb6

concurrency:
  group: span-web-workbench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  el8:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build renderer
        working-directory: prototype
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run build
      - name: Build EL8 service and unpack the runtime
        run: |
          mkdir -p /tmp/span-workbench-artifacts "$RUNNER_TEMP/span-workbench-dnf"
          cp "$(command -v node)" /tmp/span-workbench-artifacts/node
          baseline=801c589f9bf5b4ae64e67c9a055eb627461a173e
          git fetch --no-tags --depth=1 origin "$baseline"
          mkdir /tmp/span-workbench-artifacts/baseline-source
          git archive "$baseline" prototype/core | tar -x -C /tmp/span-workbench-artifacts/baseline-source
          printf '%s\n' "$baseline" > /tmp/span-workbench-artifacts/pty-baseline-commit.txt
          docker run --rm -v "$PWD:/work" -v /tmp/span-workbench-artifacts:/artifacts \
            -v "$RUNNER_TEMP/span-workbench-dnf:/var/cache/dnf" -w /work almalinux:8 bash -eu -c '
            dnf -y install gcc binutils curl ca-certificates
            curl -fsSL --retry 3 https://sh.rustup.rs -o /tmp/rustup.sh
            bash /tmp/rustup.sh -y --profile minimal --default-toolchain 1.98.1 --component rustfmt
            export PATH="$HOME/.cargo/bin:$PATH"
            cargo fmt --manifest-path prototype/core/Cargo.toml -- --check
            binary=prototype/core/target/release/span-workbench-core
            cargo build --locked --release --target-dir /tmp/span-pty-baseline-target \
              --manifest-path /artifacts/baseline-source/prototype/core/Cargo.toml
            cp /tmp/span-pty-baseline-target/release/span-workbench-core /artifacts/span-workbench-pty-baseline
            cargo build --locked --release --manifest-path prototype/core/Cargo.toml
            cargo test --locked --release --manifest-path prototype/core/Cargo.toml agent::pi::transcript::tests
            readelf --version-info "$binary" | grep -oE "GLIBC_[0-9]+(\.[0-9]+)+" | sort -Vu > /artifacts/glibc-service.txt
            test "$(tail -1 /artifacts/glibc-service.txt | cat - <(echo GLIBC_2.28) | sort -V | tail -1)" = GLIBC_2.28
          '
          bash prototype/test/package.sh linux prototype/core/target/release/span-workbench-core /tmp/span-workbench-artifacts/linux
      - name: Prepare the pre-virtualization renderer for the same-run comparison
        run: |
          baseline=6832bd32033f165eaeeff83cd42af1a670527227
          artifacts=/tmp/span-workbench-artifacts
          source_dir=$(mktemp -d)
          git fetch --no-tags --depth=1 origin "$baseline"
          git archive "$baseline" prototype | tar -x -C "$source_dir"
          npm --prefix "$source_dir/prototype" ci --no-audit --no-fund
          npm --prefix "$source_dir/prototype" run build
          cp -al "$artifacts/linux" "$artifacts/catalog-baseline"
          rm -r "$artifacts/catalog-baseline/resources/app/dist"
          cp -a "$source_dir/prototype/dist" "$artifacts/catalog-baseline/resources/app/"
          printf '%s\n' "$baseline" > "$artifacts/catalog-baseline-commit.txt"
      - name: Prepare the baseline renderer for streaming under file preview
        run: |
          baseline=e92b0193424d6a29de9a23a23a58a34ae6d91bef
          artifacts=/tmp/span-workbench-artifacts
          source_dir=$(mktemp -d)
          git fetch --no-tags --depth=1 origin "$baseline"
          git archive "$baseline" prototype | tar -x -C "$source_dir"
          npm --prefix "$source_dir/prototype" ci --no-audit --no-fund
          npm --prefix "$source_dir/prototype" run build
          cp -al "$artifacts/linux" "$artifacts/covered-baseline"
          rm -r "$artifacts/covered-baseline/resources/app/dist"
          cp -a "$source_dir/prototype/dist" "$artifacts/covered-baseline/resources/app/"
          printf '%s\n' "$baseline" > "$artifacts/covered-baseline-commit.txt"
      - name: Prepare the baseline renderer for command output
        run: |
          baseline=a60db7ad82b8c970d75b1e60ef31d44c89c996a7
          artifacts=/tmp/span-workbench-artifacts
          source_dir=$(mktemp -d)
          git fetch --no-tags --depth=1 origin "$baseline"
          git archive "$baseline" prototype | tar -x -C "$source_dir"
          npm --prefix "$source_dir/prototype" ci --no-audit --no-fund
          npm --prefix "$source_dir/prototype" run build
          cp -al "$artifacts/linux" "$artifacts/output-baseline"
          rm -r "$artifacts/output-baseline/resources/app/dist"
          cp -a "$source_dir/prototype/dist" "$artifacts/output-baseline/resources/app/"
          printf '%s\n' "$baseline" > "$artifacts/output-baseline-commit.txt"
      - name: Prepare the baseline renderers for streaming, startup and terminal output
        run: |
          artifacts=/tmp/span-workbench-artifacts
          for spec in \
            long-reply:3b8abac80eb31c73f4360a0721bb5c8823ab575e \
            following-reply:"$FOLLOWING_REPLY_BASELINE" \
            hidden-timeline:6de67d5933a3c733bfad6c2988de39e29719c60c \
            startup-loading:d5dc91b0fc082d3de69b1ef9bab8ab32e9fd56af \
            streaming-output:72576f01c969e452c5f8cc66940ce110f4fb7693 \
            reasoning:2b2da807b5ec4496e20eece8df6d54763e2379e3 \
            reasoning-details:4bbac893fab99dc4af1947521f0d27eb05c2b26a \
            reasoning-following:fec399648c3366d3b5d0c54ff8bb988b94edab96 \
            reasoning-index:21265c804bf11dc827c957c83e0717568e432a89 \
            grouped-history:6dce83b8c52b3e47dfa8de66483d05ab373f27d7 \
            terminal:"$TERMINAL_RENDERER_BASELINE" \
            terminal-cover:"$TERMINAL_COVER_BASELINE" \
            terminal-window:"$TERMINAL_WINDOW_BASELINE"
          do
            target="${spec%%:*}-baseline"
            baseline="${spec#*:}"
            source_dir=$(mktemp -d)
            git fetch --no-tags --depth=1 origin "$baseline"
            git archive "$baseline" prototype | tar -x -C "$source_dir"
            npm --prefix "$source_dir/prototype" ci --no-audit --no-fund
            npm --prefix "$source_dir/prototype" run build
            cp -al "$artifacts/linux" "$artifacts/$target"
            rm -r "$artifacts/$target/resources/app/dist"
            cp -a "$source_dir/prototype/dist" "$artifacts/$target/resources/app/"
            printf '%s\n' "$baseline" > "$artifacts/$target-commit.txt"
          done
      - name: Verify on AlmaLinux 8 and compare with Span 0.1.0
        run: |
          bash prototype/test/install-pi.sh /tmp/span-workbench-artifacts/pi-test
          baseline=span-0.1.0-1.el8.x86_64.rpm
          curl -fLsS --retry 3 "https://github.com/${GITHUB_REPOSITORY}/releases/download/v0.1.0/$baseline"             -o "/tmp/span-workbench-artifacts/$baseline"
          printf 'f395c1d3f4679173cc314574d902311ea82ced8b736883e2f5ed44556c220148  %s\n'             "/tmp/span-workbench-artifacts/$baseline" | sha256sum --check -
          docker run --rm --shm-size=1g --cap-add SYS_ADMIN \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            -v "$PWD:/work:ro" -v /tmp/span-workbench-artifacts:/artifacts -w /work \
            -v "$RUNNER_TEMP/span-workbench-dnf:/var/cache/dnf" \
            almalinux:8 bash prototype/test/el8.sh
      - name: Publish the verified EL8 preview RPM
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: /tmp/span-workbench-artifacts/span-web-preview-*.rpm
          archive: false
          if-no-files-found: warn
      - name: Publish preview and benchmark artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: span-web-el8-preview
          path: |
            /tmp/span-workbench-artifacts/*.tar.gz
            /tmp/span-workbench-artifacts/*.png
            /tmp/span-workbench-artifacts/*.json
            /tmp/span-workbench-artifacts/glibc-service.txt
            /tmp/span-workbench-artifacts/pty-baseline-commit.txt
            /tmp/span-workbench-artifacts/covered-baseline-commit.txt
            /tmp/span-workbench-artifacts/hidden-timeline-baseline-commit.txt
            /tmp/span-workbench-artifacts/output-baseline-commit.txt
            /tmp/span-workbench-artifacts/long-reply-baseline-commit.txt
            /tmp/span-workbench-artifacts/following-reply-baseline-commit.txt
            /tmp/span-workbench-artifacts/startup-loading-baseline-commit.txt
            /tmp/span-workbench-artifacts/grouped-history-baseline-commit.txt
            /tmp/span-workbench-artifacts/terminal-window-baseline-commit.txt
            /tmp/span-workbench-artifacts/streaming-output-baseline-commit.txt
            /tmp/span-workbench-artifacts/reasoning-baseline-commit.txt
            /tmp/span-workbench-artifacts/reasoning-details-baseline-commit.txt
            /tmp/span-workbench-artifacts/reasoning-following-baseline-commit.txt
            /tmp/span-workbench-artifacts/reasoning-index-baseline-commit.txt
          if-no-files-found: warn

  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build renderer and Windows service
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          cargo +1.98.1 build --locked --release --manifest-path prototype/core/Cargo.toml
          cargo +1.98.1 test --locked --release --manifest-path prototype/core/Cargo.toml agent::pi::transcript::tests
          cd prototype
          npm ci --no-audit --no-fund
          npm run check
          npm run build
      - name: Package and extract the Windows preview
        run: |
          bash prototype/test/package.sh win32 prototype/core/target/release/span-workbench-core.exe preview
          powershell.exe -NoProfile -Command '
            $ErrorActionPreference = "Stop"
            Compress-Archive -Path preview -DestinationPath preview-under-test.zip
            Expand-Archive -LiteralPath preview-under-test.zip -DestinationPath verified-preview
          '
          cmp preview/span-preview.exe verified-preview/preview/span-preview.exe
          diff -qr preview/resources/app verified-preview/preview/resources/app
      - name: Verify native Codex on Windows
        run: node prototype/test/backend-windows.mjs "$PWD/verified-preview/preview/span-preview.exe"
      - name: Verify native OpenCode on Windows
        run: |
          bash prototype/test/install-acp.sh opencode windows "$PWD/opencode-test"
          node prototype/test/real-acp.mjs opencode "$PWD/verified-preview/preview/span-preview.exe" \
            "$PWD/opencode-test/opencode.exe" "$PWD/windows-workbench-opencode.png"
      - name: Verify native Kilo on Windows
        run: |
          bash prototype/test/install-acp.sh kilo windows "$PWD/kilo-test"
          node prototype/test/real-acp.mjs kilo "$PWD/verified-preview/preview/span-preview.exe" \
            "$PWD/kilo-test/kilo.exe" "$PWD/windows-workbench-kilo.png"
      - name: Verify native Claude Code on Windows
        run: |
          bash prototype/test/install-acp.sh claude-agent-acp windows "$PWD/claude-test"
          node prototype/test/real-claude.mjs "$PWD/verified-preview/preview/span-preview.exe" \
            "$PWD/claude-test/claude-agent-acp.exe" "$PWD/windows-workbench-claude.png"
      - name: Verify native Pi on Windows
        run: |
          bash prototype/test/install-pi.sh "$PWD/pi-test"
          SPAN_TEST_PI_TEAMS="$PWD/pi-test/team-state-fixture" node prototype/test/real-pi.mjs \
            "$PWD/verified-preview/preview/span-preview.exe" "$PWD/pi-test/node_modules/.bin/pi.cmd" "$PWD/windows-workbench-pi.png"
      - name: Prepare the baseline renderers for terminal output and preview
        run: |
          for spec in terminal:"$TERMINAL_RENDERER_BASELINE" terminal-cover:"$TERMINAL_COVER_BASELINE" \
            terminal-window:"$TERMINAL_WINDOW_BASELINE" following-reply:"$FOLLOWING_REPLY_BASELINE"; do
            target="${spec%%:*}-baseline"
            baseline="${spec#*:}"
            source_dir=$(mktemp -d)
            git fetch --no-tags --depth=1 origin "$baseline"
            git archive "$baseline" prototype | tar -x -C "$source_dir"
            npm --prefix "$source_dir/prototype" ci --no-audit --no-fund
            npm --prefix "$source_dir/prototype" run build
            cp -R verified-preview/preview "$target"
            rm -r "$target/resources/app/dist"
            cp -R "$source_dir/prototype/dist" "$target/resources/app/"
          done
      - name: Verify the extracted Windows preview and native ConPTY
        id: desktop_checks
        run: |
          node prototype/test/terminal-pressure.mjs prototype/core/target/release/span-workbench-core.exe
          binary="$PWD/verified-preview/preview/span-preview.exe"
          node prototype/test/startup-loading.mjs "$binary" "" "$PWD/windows-workbench-startup.png" | tee windows-workbench-startup.json
          node prototype/test/smoke.mjs "$binary" "$PWD/windows-workbench.png"
          node prototype/test/catalog.mjs "$binary" "$PWD/windows-workbench-catalog.png"
          node prototype/test/covered-transcript.mjs "$binary" "" "" "$PWD/windows-workbench-preview-switch"
          node prototype/test/long-reply.mjs "$binary" "" "$PWD/windows-workbench-long-reply"
          node prototype/test/long-reply.mjs "$binary" "$PWD/following-reply-baseline/span-preview.exe" --following | tee windows-workbench-following-reply.json
          node prototype/test/long-reply.mjs "$binary" "" "$PWD/windows-workbench-grouped-history" --grouped-history
          node prototype/test/long-reply.mjs "$binary" --tool-output
          reasoning_result=0
          SPAN_TEST_DEVICE_SCALE=1.25 node prototype/test/long-reply.mjs \
            "$binary" "" "$PWD/windows-workbench-reasoning-stream-125" --reasoning \
            | tee windows-workbench-reasoning-stream-125.json || reasoning_result=$?
          node prototype/test/long-reply.mjs "$binary" "" "$PWD/windows-workbench-reasoning-details" --reasoning-details \
            | tee windows-workbench-reasoning-details.json || reasoning_result=$?
          node prototype/test/long-reply.mjs "$binary" "" "$PWD/windows-workbench-reasoning-following" --reasoning-following \
            | tee windows-workbench-reasoning-following.json || reasoning_result=$?
          node prototype/test/long-reply.mjs "$binary" "" "$PWD/windows-workbench-reasoning-index" --reasoning-index \
            | tee windows-workbench-reasoning-index.json || reasoning_result=$?
          node prototype/test/patch-view.mjs "$binary" "$PWD/windows-workbench-patch.png"
          node prototype/test/output-view.mjs "$binary" "$PWD/windows-workbench-output.png"
          node prototype/test/resource-isolation.mjs "$binary" "$PWD/windows-workbench-resource-isolation.json" \
            "$PWD/terminal-baseline/span-preview.exe" "$TERMINAL_RENDERER_BASELINE" \
            "$PWD/terminal-cover-baseline/span-preview.exe" "$TERMINAL_COVER_BASELINE" \
            "$PWD/terminal-window-baseline/span-preview.exe" "$TERMINAL_WINDOW_BASELINE"
          if ((reasoning_result != 0)); then exit "$reasoning_result"; fi
          mv preview-under-test.zip span-web-windows-x86_64.zip
      - name: Compare native Windows wheel rendering with and without animation
        if: ${{ !cancelled() && (steps.desktop_checks.outcome == 'success' || steps.desktop_checks.outcome == 'failure') }}
        timeout-minutes: 3
        run: node prototype/test/scroll-windows.mjs "$PWD/verified-preview/preview/span-preview.exe" "$PWD/windows-workbench-scroll.json"
      - name: Publish Windows preview and screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: span-web-windows-preview
          path: |
            span-web-windows-x86_64.zip
            windows-workbench*.png
            windows-workbench-startup.json
            windows-workbench-reasoning-*.json
            windows-workbench-resource-isolation.json
            windows-workbench-following-reply.json
            windows-workbench-scroll.json
          if-no-files-found: warn
